<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  
  <!-- 1. SEO Principal -->
  <title>Churrascômetro & Pix | Calculadora de Rateio de Churrasco</title>
  <meta name="description" content="Organize seu churrasco sem dor de cabeça. Calcule o rateio justo separando quem só come de quem bebe, controle a lista de presença e gere o QR Code Pix na hora." />
  <meta name="keywords" content="rateio de churrasco, calculadora de churrasco, churrascômetro, dividir conta churrasco, qr code pix churrasco, organizar churrasco" />
  <meta name="author" content="RevLevih" />
  <meta name="robots" content="index, follow" />

  <!-- 2. Open Graph / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="🥩 Churrascômetro & Rateio Pix" />
  <meta property="og:description" content="Calcule o rateio proporcional (Só Comida vs. Comida + Bebida), acompanhe quem já pagou e gere o QR Code Pix instantaneamente." />
  <meta property="og:image" content="icon.png" />
  <meta property="og:locale" content="pt_BR" />

  <!-- 3. PWA / Mobile -->
  <meta name="theme-color" content="#ea580c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <!-- Biblioteca QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 12px 40px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .header-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-salvo {
      font-size: 0.7rem;
      background: #dcfce7;
      color: #15803d;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn-ajuda-topo {
      background: #fff7ed;
      color: var(--primary);
      border: 1px solid #fed7aa;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-ajuda-topo:hover {
      background: #ffedd5;
    }

    h1 {
      font-size: 1.25rem;
      color: var(--primary);
    }

    h2 {
      font-size: 1.08rem;
      margin-bottom: 12px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    p.subtitle {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-acao-topo {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      transition: all 0.15s;
    }

    .btn-acao-topo.salvar {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .full-width {
      grid-column: span 2;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    input, select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      background: #fff;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .aviso-data {
      grid-column: span 2;
      font-size: 0.78rem;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 8px 10px;
      border-radius: 8px;
      display: none;
      font-weight: 600;
    }

    .add-row {
      display: grid;
      grid-template-columns: 1.4fr 1.2fr auto;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-add:hover {
      background: var(--primary-hover);
    }

    .lista-participantes {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-participante {
      display: grid;
      grid-template-columns: auto 1fr auto auto auto;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafafa;
      font-size: 0.9rem;
    }

    .item-participante input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .item-participante.pago {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .item-participante select {
      padding: 6px;
      font-size: 0.82rem;
      width: auto;
    }

    .valor-tag {
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 75px;
      text-align: right;
    }

    .btn-del {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .cards-rateio {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .card-opcao {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
    }

    .card-opcao.active {
      border-color: var(--primary);
      background: #fff7ed;
    }

    .card-opcao span {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-opcao strong {
      font-size: 1.25rem;
      color: var(--text);
    }

    .balanco-bar {
      margin-top: 12px;
      padding: 10px 12px;
      background: #f1f5f9;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .qr-box {
      margin-top: 16px;
      background: #fafafa;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    #qrcode {
      background: #ffffff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-copia-cola {
      background: #1e293b;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-whats {
      margin-top: 14px;
      width: 100%;
      background: #25d366;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Histórico de Churrascos */
    .lista-historico {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-historico {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
      gap: 10px;
    }

    .info-historico strong {
      display: block;
      font-size: 0.95rem;
      color: var(--text);
    }

    .info-historico span {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .acoes-historico {
      display: flex;
      gap: 6px;
    }

    .btn-hist-abrir {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-hist-del {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* Seção de Ajuda (Sanfona / FAQ no rodapé) */
    details.faq-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: #fafafa;
    }

    details.faq-item summary {
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text);
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    details.faq-item summary::after {
      content: "➕";
      font-size: 0.75rem;
      color: var(--primary);
    }

    details.faq-item[open] summary::after {
      content: "➖";
    }

    details.faq-item p {
      margin-top: 8px;
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.45;
    }

    /* Modal de Ajuda Passo a Passo */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-overlay.aberto {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 1.15rem;
      color: var(--primary);
    }

    .btn-fechar-modal {
      background: #f1f5f9;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .passo-ajuda {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      align-items: flex-start;
    }

    .passo-numero {
      background: var(--primary);
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .passo-texto strong {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .passo-texto span {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.4;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Bloco 1: Evento e Gastos -->
    <div class="card">
      <div class="header-brand">
        <div class="header-left">
          <img src="icon.png" alt="Ícone Churrasco" onerror="this.style.display='none'" />
          <h1>Churrascômetro</h1>
        </div>
        <div class="header-right">
          <span class="badge-salvo" id="badgeSalvo">✓ Salvo</span>
          <button type="button" class="btn-ajuda-topo" id="btnAbrirAjuda">❓ Como Usar</button>
        </div>
      </div>
      <p class="subtitle">Seus dados e participantes ficam salvos automaticamente no aparelho.</p>

      <div class="top-actions">
        <button type="button" class
